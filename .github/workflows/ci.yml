name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Rust (GNU toolchain, matches the helper build)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - run: npm ci
      - run: npm run typecheck
      # Builds hook-helper.exe and runs the C++ tests. The TypeScript tests need a built helper.
      - run: npm run test:helper
      # Builds the Rust helper (release). The TypeScript integration test prefers it over C++.
      - run: npm run build:helper:rust
      - run: npm test
      - run: npm run build
      - run: npm run build:site
