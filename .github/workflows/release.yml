name: Release

# Push a tag that matches package.json's version (for example v0.2.1) to build the installer and publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Keep the locally built helper and the shipped one on the same toolchain.
  # GNU links the C runtime statically, so users need no VC++ redistributable
  # (the C++ helper is compiled with /MT for the same reason).
  RUST_TOOLCHAIN: stable-x86_64-pc-windows-gnu

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "lolPing $GITHUB_REF_NAME" --generate-notes

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Rust (${{ env.RUST_TOOLCHAIN }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache the Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust-helper
      - run: npm ci
      - run: npm run test:helper
      # Builds the Rust helper (release). `npm test` prefers it; `dist` rebuilds it for packaging.
      - run: npm run build:helper:rust
      - run: npm test
      - run: npm run dist
      - name: Upload the installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "release/lolPing-Setup-${GITHUB_REF_NAME#v}.exe" --clobber
