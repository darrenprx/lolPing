name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Keep the release out of the latest-release feed until every platform's assets are ready.
      # A re-run keeps an existing release and its assets.
      - name: Create the release as a draft if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -Fx "$GITHUB_REF_NAME" > /dev/null \
            || gh release create "$GITHUB_REF_NAME" --title "lolPing $GITHUB_REF_NAME" --generate-notes --draft

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:helper
      - run: npm test
      - run: npm run dist
      - name: Upload the installer and its update files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # latest.yml and the blockmap are what electron-updater in an installed lolPing reads to find and fetch this version.
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "release/lolPing-Setup-${GITHUB_REF_NAME#v}.exe" \
            "release/latest.yml" \
            "release/lolPing-Setup-${GITHUB_REF_NAME#v}.exe.blockmap" \
            --clobber

  mac:
    needs: release
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # gh uses GH_TOKEN; nothing here pushes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:helper
      - run: npm test
      - run: npm run dist:mac
      - run: codesign --verify --deep --strict "release/mac-arm64/lolPing.app"
      - name: Upload the disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "release/lolPing-${GITHUB_REF_NAME#v}-arm64.dmg" --clobber

  linux:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxtst-dev xvfb
      - run: npm ci
      - run: npm run test:helper
      - run: npm run test:linux-input
      - run: npm test
      - run: npm run dist:linux
      - name: Upload Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.AppImage release/*.deb --clobber

  # Publish only after all platform installers and update files are uploaded.
  publish:
    needs: [windows, mac, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
