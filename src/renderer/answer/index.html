<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>lolPing answer</title>
    <link rel="stylesheet" href="./answer.css" />
  </head>
  <body>
    <div id="root" hidden>
      <div id="panel">
        <div id="head">
          <span id="glyph">✻</span>
          <span id="title"></span>
          <button id="close" title="">✕</button>
        </div>
        <div id="shot" hidden><img id="thumb" alt="" /></div>
        <div id="chat"></div>
        <div id="ask">
          <span class="prompt">❯</span>
          <input id="q" type="text" autocomplete="off" spellcheck="false" />
          <button id="send" title=""></button>
        </div>
        <div id="foot">
          <span id="closeHint"></span>
          <div id="countdown" hidden><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
